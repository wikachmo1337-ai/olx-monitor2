name: OLX monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"   # запасной вариант; основной запуск — cron-job.org раз в 1-2 минуты

concurrency:
  group: olx-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python monitor/olx_monitor.py
      - name: Commit ads
        run: |
          git config user.name "olx-bot"
          git config user.email "olx-bot@users.noreply.github.com"
          git add docs/ads.json
          git diff --cached --quiet || (git commit -m "update ads" && git pull --rebase && git push)
